name = "physicslib"
version = "0.1.0"
defaultTargets = [
  "PersistenceMechanics", "PMSubstrate", "PMAction", "PMConstants",
  "PMKAutomaton", "PMElementaryParticles", "PMFlavor", "PMHadrons", "PMAtoms", "PMCosmology",
  "CN1", "ELEM", "Classification"
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "PersistenceMechanics"
srcDir = "src"
globs = ["PersistenceMechanics", "PersistenceMechanics.+"]

[[lean_lib]]
name = "PMSubstrate"
srcDir = "src"
globs = ["PMSubstrate", "PMSubstrate.Research.+"]

[[lean_lib]]
name = "PMAction"
srcDir = "src"
# The native machine shares lower-level proofs with PMAction.
globs = ["PMAction", "PMAction.+", "PMKAutomaton.Machine", "PMKAutomaton.Machine.+"]

[[lean_lib]]
name = "PMConstants"
srcDir = "src"
globs = ["PMConstants", "PMConstants.+"]

[[lean_lib]]
name = "PMKAutomaton"
srcDir = "src"
# The machine is built with PMAction. This target adds the packet-level handoff.
globs = ["PMKAutomaton", "PMKAutomaton.HandoffAdmittance", "PMKAutomaton.TwoSiteHandoff", "PMKAutomaton.OpenHandoff", "PMKAutomaton.OddReferenceSource", "PMKAutomaton.RootClockCalibration", "PMKAutomaton.ClockedRootTrials", "PMKAutomaton.Interface", "PMKAutomaton.Values", "PMKAutomaton.LocalController", "PMKAutomaton.RingReceiver", "PMKAutomaton.BoundaryErasure", "PMKAutomaton.Components", "PMKAutomaton.ClockRing", "PMKAutomaton.ClockAlignment", "PMKAutomaton.ClockTickWeights", "PMKAutomaton.ClockSites", "PMKAutomaton.WallCrossing", "PMKAutomaton.AlignedSectors"]

[[lean_lib]]
name = "PMFlavor"
srcDir = "src"
globs = ["PMFlavor", "PMFlavor.+"]

[[lean_lib]]
name = "PMElementaryParticles"
srcDir = "src"
globs = ["PMElementaryParticles", "PMElementaryParticles.+", "PMElementaryParticles.ChannelPlacement", "PMElementaryParticles.RingRates", "PMElementaryParticles.RingSurvivors"]

[[lean_lib]]
name = "PMHadrons"
srcDir = "src"
globs = ["PMHadrons", "PMHadrons.+"]

[[lean_lib]]
name = "PMAtoms"
srcDir = "src"
globs = ["PMAtoms", "PMAtoms.+"]

[[lean_lib]]
name = "PMCosmology"
srcDir = "src"
globs = ["PMCosmology", "PMCosmology.+"]

[[lean_lib]]
name = "CN1"
srcDir = "src/classification"
globs = ["CN1.Foundations.+", "CN1.Finite.+"]

[[lean_lib]]
name = "ELEM"
srcDir = "src/classification"
globs = ["ELEM.+"]

[[lean_lib]]
name = "Classification"
srcDir = "src/classification"

[[lean_lib]]
name = "E8PConstants"
srcDir = "tools/e8p"
globs = ["E8PConstants", "E8PConstants.+"]

[[lean_lib]]
name = "E8PConstantsProof"
srcDir = "tools/e8p"

[[lean_exe]]
name = "e8p"
srcDir = "tools/e8p"
root = "ConstantsMain"
needs = ["E8PConstantsProof"]
